<div id="benchmark-history" class="benchmark-history"{% if benchmark_data_json %} data-benchmark='{{ benchmark_data_json | safe }}'{% endif %}>
    {% if entries %}
    <table class="benchmark-table">
        <thead>
            <tr>
                <th>Benchmark</th>
                <th>Date</th>
                <th>Time</th>
                <th>RX / Scaled</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for entry in entries %}
            <tr>
                <td class="benchmark-name">{{ entry.benchmark_name }}</td>
                <td class="benchmark-date text-muted">{{ entry.recorded_at }}</td>
                <td class="benchmark-time">{{ entry.formatted_time }}</td>
                <td>
                    {% if entry.is_rx %}
                    <span class="badge badge-rx">RX</span>
                    {% else %}
                    <span class="badge badge-scaled">Scaled</span>
                    {% endif %}
                </td>
                <td>
                    <div class="one-rm-actions">
                    <button class="btn-edit"
                            hx-get="/benchmark-results/{{ entry.id }}/edit"
                            hx-target="closest tr"
                            hx-swap="outerHTML"
                            title="Edit">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                    </button>
                    <button class="btn-delete"
                            hx-delete="/benchmark-results/{{ entry.id }}/delete"
                            hx-target="#benchmark-history"
                            hx-swap="outerHTML"
                            hx-confirm="Delete {{ entry.benchmark_name }} {{ entry.formatted_time }} entry?"
                            title="Delete">
                        &times;
                    </button>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-muted benchmark-empty">No entries yet.</p>
    {% endif %}
</div>
