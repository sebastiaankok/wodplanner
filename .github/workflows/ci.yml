name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -e ".[api,dev]"

      - run: ruff check .

      - run: mypy src

      - run: WODAPP_API_BASE_URL=http://test.test pytest --tb=short
